name: Teacher Android UAT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacher-android-uat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate shared Flutter package
        working-directory: packages/mobile_shared
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Validate teacher app
        run: |
          flutter pub get
          flutter analyze

  distribute:
    name: Build and distribute signed UAT APK
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Check one-time release settings
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_TEACHERS_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_TESTER_EMAILS: ${{ vars.FIREBASE_TESTER_EMAILS }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_ANDROID_APP_ID FIREBASE_PROJECT_ID FIREBASE_API_KEY FIREBASE_MESSAGING_SENDER_ID FIREBASE_TESTER_EMAILS GOOGLE_SERVER_CLIENT_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing uat environment values: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/school-erp-uat.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/school-erp-uat.jks" >> "$GITHUB_ENV"
      - name: Generate Android Firebase build configuration
        env:
          ANDROID_APPLICATION_ID: com.iqnaut.teachers_app
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_TEACHERS_APP_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: node scripts/write-google-services-json.mjs
      - name: Build signed Teacher APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_TEACHERS_APP_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BUILD_NAME="0.1.${RUN_NUMBER}"
          flutter pub get
          build_args=(
            "--build-name=$BUILD_NAME"
            "--build-number=$RUN_NUMBER"
            --dart-define=SCHOOL_ERP_UAT=true
            "--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY"
            "--dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID"
            "--dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            "--dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            "--dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
          )
          flutter build apk --flavor uat --release "${build_args[@]}"
          mkdir -p artifacts/android
          cp build/app/outputs/flutter-apk/app-uat-release.apk "artifacts/android/teacher_app_v${BUILD_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: school-erp-teacher-android-uat-${{ github.run_number }}
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Run Firebase Test Lab Robo smoke test
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gcloud firebase test android run \
            --project "$FIREBASE_PROJECT_ID" \
            --type robo \
            --app "artifacts/android/teacher_app_v0.1.${RUN_NUMBER}.apk" \
            --device model=MediumPhone.arm,version=35,locale=en,orientation=portrait \
            --timeout 120s \
            --client-details matrixLabel="teacher-uat-${RUN_NUMBER}"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Distribute to UAT testers
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_TEACHERS_APP_ID }}
          FIREBASE_TESTER_EMAILS: ${{ vars.FIREBASE_TESTER_EMAILS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          firebase appdistribution:distribute "artifacts/android/teacher_app_v0.1.${RUN_NUMBER}.apk" \
            --app "$FIREBASE_APP_ID" --testers "$FIREBASE_TESTER_EMAILS" \
            --release-notes "Automated UAT build ${RUN_NUMBER} from commit ${GITHUB_SHA}"
