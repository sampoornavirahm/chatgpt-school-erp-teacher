name: school_erp_mobile_shared
description: Shared Flutter foundation for School ERP teacher and parent apps.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.0.0
  firebase_analytics: ^13.0.0
  firebase_crashlytics: ^6.0.0
  firebase_messaging: ^17.0.0
  firebase_in_app_messaging: ^0.10.0
  firebase_remote_config: ^7.0.0
  firebase_performance: ^0.12.0
  google_sign_in: ^7.2.0
  local_auth: ^3.0.2
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  http: ^1.5.0
  crypto: ^3.0.7
  sqflite: ^2.4.4+2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/logow.png
